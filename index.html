<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1222">
<title>FlowTask — Kanban Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="logo" aria-hidden="true">▤</span><div><h1>FlowTask</h1><p id="summary">0 of 0 done</p></div></div>
    <button class="new" id="newBtn" type="button"><span aria-hidden="true">+</span> New task</button>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Columns"></div>
</header>

<main class="board" id="board"></main>

<div class="shade" id="shade" hidden>
  <form class="modal" id="form" role="dialog" aria-modal="true" aria-labelledby="mTitle" novalidate>
    <h2 id="mTitle">New task</h2>
    <label>Title<input id="fTitle" type="text" maxlength="80" placeholder="e.g. Design onboarding flow" autocomplete="off"></label>
    <label>Notes<textarea id="fDesc" rows="3" maxlength="240" placeholder="Optional details"></textarea></label>
    <div class="two">
      <label>Priority<select id="fPri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label>
      <label>Column<select id="fCol"><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Done</option></select></label>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn go" id="save">Add task</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="undo" hidden>Undo</button></div>
<script src="script.js"></script>
</body>
</html>
